name: Draft release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release source
        run: |
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          python3 -m unittest discover -s tests -v
          python3 scripts/check_dependencies.py
      - name: Build archive and SBOM
        id: build
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py "$RELEASE_TAG"
      - name: Attest build provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26
        with:
          subject-path: ${{ steps.build.outputs.archive }}
      - name: Attest SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26
        with:
          subject-path: ${{ steps.build.outputs.archive }}
          sbom-path: dist/sbom.cdx.json
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS dist/sbom.cdx.json
