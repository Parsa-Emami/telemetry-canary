name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    name: Local tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - run: git show --format= --check HEAD
  supply-chain:
    name: Dependency and secret checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 scripts/check_dependencies.py
      - name: Scan reachable Git history
        env:
          GOTOOLCHAIN: go1.25.4
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.0
          "$(go env GOPATH)/bin/gitleaks" git --redact --log-opts="--all" .
